# ---------------------------------- #
#            Sign Config             #
# ---------------------------------- #
# This is the configuration file for Sign.
# To apply any changes you make here, run: /sign reload
# Wiki: https://docs.lode.gg/sign/server-owners/overview
version: 1

nametags:
  # Enable the nametags.
  # Set this to false if you want the vanilla player nametags shown instead.
  enabled: true

  # Should players see their own nametag?
  # Set to true to show your own nametag above your head (in first-person view).
  # Set to false to hide it.
  show-self: true

  # How often nametags should update (in ticks). 20 ticks = 1 second.
  # Lower = more frequent updates = more accurate, but slightly more CPU usage.
  # Recommended: 20 ticks
  update-interval: 20

  # How far away other players must be to see someone's nametag (in blocks).
  # Example: 32 = players can see nametags from up to 32 blocks away.
  visibility-distance: 32

  # Nametag Text Display Properties
  display:
    # The lines of text shown on the nametag, top to bottom.
    # Supports MiniMessage formatting: https://webui.advntr.dev/
    # PlaceholderAPI is supported for dynamic data.
    #
    # Built-in placeholders (no extra plugin needed):
    # {player}  - Player's name
    # {health}  - Player's current health (e.g. 20)
    # {voice}   - Voice chat status icon (requires Simple Voice Chat & voice-chat.enabled)
    lines:
      - "<gray>{player}</gray>"
      - "<red>❤ <white>{health}"

    # Enable text shadow for the text display of a nametag.
    # Available values: true, false
    text-shadow: true

    # Should the text display of nametags be seen through?
    # Available values: true, false
    see-through: false

    # Should the text display support player crouching?
    # If enabled, see through is false, and opacity of the text display is lower.
    support-crouching: true

    # Should the nametag have its own dedicated hologram? Or should Sign place it all in one hologram.
    # The difference is having the giant background padding. If false, then it will create its own hologram for each line.
    condense-holograms: false

    # The text alignment of the nametag's text display.
    # Available values: left, right, center
    text-alignment: "center"

    # The background color of the nametag's text display.
    # Use a hex color (like "#FFFFFF" for white), or "transparent" for no background.
    # Available values (excluding hex colors): default, transparent
    background: "default"

    # The billboard of the nametag's display.
    # Available values: fixed, vertical, horizontal, center
    billboard: "center"

    # The scale of the nametag's display.
    # This can be used to change the size of the nametag.
    scale:
      x: 1
      y: 1
      z: 1

  # Voice Chat Integration (optional)
  # Adds the {voice} placeholder to display a player's voice chat status icon.
  # Requires Simple Voice Chat. If Amplifier is also installed, its deafen state is used.
  voice-chat:
    # Enable the {voice} placeholder. If disabled, {voice} will resolve to an empty string.
    enabled: false

    # The icons shown for each voice state.
    # Supports MiniMessage formatting, so you can use <font:namespace:key> for custom resource pack fonts.
    icons:
      speaking: "🔊"
      idle: "🔈"
      deafened: "🔇"
      disconnected: "🔌"